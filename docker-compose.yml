version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: video-processor-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: video_processing
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: video-processor-app
    ports:
      - "8080:8080"
    environment:
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8080
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: password
      DB_NAME: video_processing
      STORAGE_UPLOAD_DIR: /app/storage/uploads
      STORAGE_PROCESSED_DIR: /app/storage/processed
      STORAGE_THUMBNAIL_DIR: /app/storage/thumbnails
      PROCESSING_WORKER_COUNT: 4
      LOG_LEVEL: info
    volumes:
      - ./storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
